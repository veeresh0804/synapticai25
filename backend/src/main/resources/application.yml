server:
  port: 8081
  cors:
    allowed-origins: "http://localhost:8080"

spring:
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:file:./db/sudheeai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    # MUST be provided via JWT_SECRET env var (min 32 bytes for HMAC-SHA256).
    # No default committed to git to prevent cross-env token forgery.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
  ai:
    gemini-key: ${AI_PROVIDER_API_KEY:}
  seed:
    # MUST be provided via SEED_SECRET env var. Empty = seeding disabled.
    secret: ${SEED_SECRET:}
  google:
    # Google OAuth Client ID for verifying GIS ID tokens.
    # Get from https://console.cloud.google.com/apis/credentials
    # Frontend needs the same value as VITE_GOOGLE_CLIENT_ID.
    client-id: ${GOOGLE_CLIENT_ID:}
