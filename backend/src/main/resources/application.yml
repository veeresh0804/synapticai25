server:
  port: 8081
  cors:
    allowed-origins: "http://localhost:8080"

spring:
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:file:./db/sudheeai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    # 256-bit key for HMAC-SHA256 signing (minimum 32 bytes)
    secret: "sudheeai_secure_token_secret_key_2026_java_spring_boot_jwt_signing_key_must_be_long_enough"
    expiration-ms: 86400000 # 24 hours
  ai:
    gemini-key: ${AI_PROVIDER_API_KEY:}
  seed:
    secret: ${SEED_SECRET:sb_seed_9f4b1aa86dad4705b8a1a2f7ea38e96a}
